<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1208"/><stop offset="1" stop-color="#0a0604"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#d4af63" stop-opacity=".25"/><stop offset="1" stop-color="#d4af63" stop-opacity="0"/></radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c08a3a"/><stop offset=".5" stop-color="#f1d187"/><stop offset="1" stop-color="#c08a3a"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g transform="translate(400 300)" opacity=".7">
    <rect x="-180" y="-100" width="360" height="200" rx="14" fill="none" stroke="url(#ribbon)" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="url(#ribbon)" font-style="italic">Soon</text>
    <text x="0" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#f1d187" opacity=".7">Coming</text>
  </g>
</svg>